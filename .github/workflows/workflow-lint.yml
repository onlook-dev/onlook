name: Workflow lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - scripts/check-workflows.ts
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - scripts/check-workflows.ts
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Lint workflows
        run: bun run check:workflows
