name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Build and upload an unsigned Windows review installer
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows runtime
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Real Windows runtime checks
        run: bun run test:windows
      - name: Windows update signature checks
        run: bun test scripts/packaging.test.ts scripts/windows-update-signature.test.ts
      - name: Package unsigned Windows installer
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.package) }}
        env:
          ONLOOK_WINDOWS_ALLOW_UNSIGNED: '1'
          STUDIO_CLOUD_BUILD: '0'
        run: bun run build:windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.package) }}
        with:
          name: windows-unsigned-review
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
  verify:
    name: Verify
    runs-on: ubuntu-24.04 # ubuntu-latest moved to 26.04 (2026-10-19), where node-pty's install script fails
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan
        run: bun run check:secrets

      - name: Changeset check
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: bunx changeset status --since=origin/main

      - name: Publication patterns
        run: bun run check:publication

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:report

      - name: Unit test summary
        if: always()
        run: bun scripts/junit-summary.ts .test-results/unit.xml

      - name: Real PTY tests
        run: bun run test:pty

      - name: Orphaned string check
        run: bun run check:strings

      - name: Import boundary check
        run: bun run check:imports

      - name: Unused code check
        run: bun run check:unused

      - name: Throwaway script check
        run: bun run check:scratch

      - name: Static lint
        run: bun run check:lint

      - name: React doctor scan
        run: bun run check:react

      - name: Production build
        run: bun run build
