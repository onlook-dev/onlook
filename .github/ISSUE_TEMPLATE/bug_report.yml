name: Bug report
description: Something in Onlook doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Onlook version
      description: In the menu bar, Onlook > About Onlook.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.5, Apple silicon
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a recording
      description: Drag files in here. Leave out secrets and anything from a private project.
