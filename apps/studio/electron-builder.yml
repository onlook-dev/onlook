appId: com.onlook.studio.source
productName: Onlook Source
copyright: Copyright © 2026 Onlook

protocols: []

directories:
  buildResources: build
  output: ../../release

# Only the electron-vite output plus the runtime externals. Workspace packages
# are devDependencies and already bundled into out/ by Vite — electron-builder
# 26's node-module-collector must never be asked to resolve a `workspace:`
# range, which is what this split buys us.
files:
  - out/**
  - '!out/third-party-notices/**'
  - package.json
  - from: ../..
    to: .
    filter: [NOTICE]
  - from: out/third-party-notices/${os}-${arch}
    to: .
    filter: [LICENSES.chromium.html]

# The DMG window's background art, shipped INSIDE the app (Contents/Resources)
# so the mounted volume's root holds no stray file for a hidden-files-visible
# Finder to render (ONL-1947). It must ride in here — before signing — because
# scripts/cut-dmg.ts re-points the window's background alias at it after the
# build, and a file added to the bundle any later would break the seal. The
# tiff is generated by that script (retina merge of the two brand jpgs); it is
# gitignored and absent until a cut runs.

# Native / per-platform binaries cannot live inside the asar.
#
# The trailing `*` on the SDK entry is load-bearing (ONL-1802): the CLI binary
# ships in a SEPARATE optional package per platform —
# `@anthropic-ai/claude-agent-sdk-darwin-arm64/claude` — which the narrower
# `claude-agent-sdk/**` glob does not match. Unpacking it is necessary but NOT
# sufficient: the SDK still computes the `app.asar` form of the path, so
# src/main/agent-host/cli-path.ts rewrites it. Both halves are required.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk*/**

afterExtract: ./build/stage-electron-notice.mjs
afterPack: ./build/harden-electron.mjs
afterSign: ./build/notarize-app.mjs

mac:
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-!(darwin-${arch}){,/**}'
  extraResources:
    - from: build/dmg-background.tiff
  category: public.app-category.developer-tools
  target:
    # dmg = what a friendly installs once. zip = what electron-updater consumes.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Developer-ID + notarized from day 1: Sequoia/Tahoe killed the
  # right-click-open bypass, so an ad-hoc DMG reads as "damaged" to a friendly.
  #
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  files:
    - '!node_modules/@anthropic-ai/claude-agent-sdk-!(win32-${arch}){,/**}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Points at the 1x. electron-builder finds `<name>@2x.<ext>` beside it and
  # merges the pair with `tiffutil -cathidpicheck`; naming the @2x here instead
  # sends it looking for `...@2x@2x.jpg`, and the retina half silently vanishes.
  #
  # The window is SIZED FROM THIS IMAGE (600x440), not from a `window:` key.
  # That is also the only lever on the layout: the art's usable light band is a
  # fixed fraction of the image, so it grows and shrinks with the window and
  # nothing else. Shrinking the window to "fit better" closes the band the
  # icons live in. The builder still copies its merged tiff to the
  # volume root; scripts/cut-dmg.ts re-points the window at the in-app copy
  # and removes the root file afterwards (ONL-1947).
  background: resources/brand/dmg-background.jpg
  # No volume icon: .VolumeIcon.icns can only live at the volume root, where a
  # hidden-files-visible Finder renders it as a stray file icon in the install
  # window (ONL-1947: nothing in the window but
  # the app and the Applications link, and no scrollbars). The mounted volume
  # wears the generic disk icon; the window is the surface that matters.
  icon: null
  # Pinned rather than left to the default, because the window's whole layout
  # is derived from it: the art's usable light band is a fixed FRACTION of the
  # image, so the icon that has to fit inside it cannot be a number that moves
  # underneath us on an electron-builder bump. At this window 96 does not fit —
  # the labels reach the rock.
  iconSize: 80

  # The icons flank the art's arrow, which points from the app to the link.
  # Coordinates are icon CENTERS. Finder pads its content rect ~55px past the
  # rightmost label edge, and any overflow past the image width draws a
  # permanent horizontal scrollbar (ONL-1947); the link's label ends ~465 with
  # ~520 of padded rect, inside the 600 the art gives us.
  #
  # y=190 puts both icons on the arrow's own row. The art is what pins it, so
  # it is re-measured whenever the art changes: the headline ends
  # at y114 and the rock edge under the icons runs y292-296, which an 80px icon
  # plus its ~22px label sits between with ~36px and ~40px to spare.
  # The pair is deliberately NOT symmetric about the window's center (300):
  # the app's label is the longer of the two, so a mathematically centred pair
  # reads as sitting left. The app carries 10px of optical correction toward
  # the centre, by eye.
  contents:
    - x: 195
      y: 190
      type: file
    - x: 415
      y: 190
      type: link
      path: /Applications

publish: null
generateUpdatesFilesForAllChannels: false

npmRebuild: false
